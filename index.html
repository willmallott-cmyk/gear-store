<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gear Store</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gear Store"><meta name="theme-color" content="#25465c">
<style>
:root{--bg:#f4f5f7;--cd:#fff;--tx:#1b1f23;--mu:#6b7280;--ln:#e3e6ea;--ac:#c9631a;--acb:#fdeee0;--ok:#1f8a4c;--wn:#b45309;--wnb:#fef3c7;--bad:#c62828;--pri:#25465c;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1418;--cd:#1a2127;--tx:#eef1f4;--mu:#97a1ab;--ln:#2a333b;--ac:#f0954a;--acb:#3a2a1c;--ok:#4cc78b;--wn:#f2b24c;--wnb:#3a2f14;--bad:#ff7a73;--pri:#e8833a;--on:#111}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}
#app{max-width:640px;margin:auto;padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}h1 span{display:flex;gap:8px}
h3{font-size:12px;color:var(--mu);font-weight:600;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;overflow:hidden}.r{display:flex;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--ln)}.r:first-child{border-top:0}.r>div{flex:1;min-width:0}
.s{font-size:12px;color:var(--mu)}.w{color:var(--wn)}.b{color:var(--bad)}.o{color:var(--ok)}
button,select,input,textarea{font:inherit;color:var(--tx)}button{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--ln);background:var(--cd);cursor:pointer}
button.p{background:var(--pri);color:var(--on);border:0;font-weight:600}button.l{border:0;background:none;color:var(--ac);padding:0 6px}button.big{width:100%;min-height:46px;margin-top:14px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;background:var(--cd);margin:4px 0}textarea{min-height:150px}
.bar{height:7px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pri)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1}.seg .on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}.tabs a{flex:1;text-align:center;padding:10px 0;color:var(--mu);text-decoration:none;font-size:12px}.tabs a.on{color:var(--ac);font-weight:600}
.warn{background:var(--wnb);color:var(--wn);padding:9px 12px;border-radius:9px;font-size:14px;margin-bottom:8px}.ft{font-size:12px;color:var(--mu);text-align:center;margin:16px 6px}
.ck{width:24px;height:24px;border:2px solid var(--mu);border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;padding:40px 10px;color:var(--mu)}
.wall{background:var(--cd);background-image:radial-gradient(var(--ln) 1.6px,transparent 1.7px);background-size:20px 20px;border:1px solid var(--ln);border-radius:14px;padding:24px 14px 18px}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 14px}.wg.k{grid-template-columns:repeat(2,1fr)}
.slot{position:relative;text-align:center;cursor:pointer;padding-top:14px}.slot .hook{position:absolute;top:0;left:50%;width:10px;height:10px;margin-left:-5px;border:2px solid var(--mu);border-radius:50%;border-bottom-color:transparent}
.slot svg{width:46px;height:46px;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.slot.own{color:var(--ac)}.slot.own svg path{fill:currentColor;fill-opacity:.25}.slot.gap{color:var(--wn)}.slot.gap svg path{fill:currentColor}.slot.empty{color:var(--mu)}.slot.empty svg{stroke-dasharray:3 2.5;opacity:.65}
.slot b{display:block;font-size:12px;color:var(--tx);margin-top:4px}.slot.sel b{text-decoration:underline}
.tub{border:1px solid var(--ln);border-top:7px solid var(--mu);border-radius:5px 5px 16px 16px;background:var(--bg);padding:12px 6px 10px}.tub .hook{display:none}
</style></head><body><div id="app"></div><nav class="tabs" id="tabs"></nav>
<script>
const K='gearstore.v1',TERMS='2026-10-v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const CATS=['Clothing','Footwear','Equipment','Sleeping','Technical','Cooking and camp','First aid','Toiletries','Electronics','Other'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{terms:'',gear:[],trips:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STOP=new Set('a an the and or for with of to in on your you be that must can is are at as pair set thin thick warm light lightweight heavyweight strong small smaller good spare extra sturdy'.split(' '));
const tok=t=>new Set(String(t).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>1&&!STOP.has(w)).map(w=>w.length>3&&w.endsWith('s')?w.slice(0,-1):w));
const hit=(g,r)=>{const gt=tok(g.name);return r.alts.some(a=>{const w=tok(a);if(!w.size)return 0;let n=0;w.forEach(x=>gt.has(x)&&n++);return n/w.size>=.6||(w.size==1&&n==1)})};
const kg=g=>(g||0)/1000,fmt=n=>n.toFixed(1)+' kg';
const FT='<p class="ft">Suggestions only. Always check the organiser\'s own list and don\'t rely on this app for your safety.</p>';
function guess(t){t=t.toLowerCase();const h=a=>a.some(x=>t.includes(x));return h(['crampon','ice axe','harness','helmet','rope'])?'Technical':h(['boot','shoe','sock','gaiter','trainer'])?'Footwear':h(['sleeping','bivi','liner'])?'Sleeping':h(['stove','tent','tarp'])?'Cooking and camp':h(['first aid','plaster','blister'])?'First aid':h(['sunscreen','toothbrush','towel','wipes'])?'Toiletries':h(['torch','battery','charger','camera','power bank'])?'Electronics':h(['jacket','trouser','base layer','fleece','glove','hat','buff','balaclava','shirt','puffa','shell','mitt'])?'Clothing':h(['rucksack','backpack','duffle','pack','bottle','pole','dry bag'])?'Equipment':'Other'}
function alts(t){const n=t.replace(/\([^)]*\)/g,'').trim();if(n.includes(' / ')){const p=n.split(' / ').map(s=>s.trim()).filter(Boolean);if(p.length>1)return p}const o=n.split(' or ');if(o.length==2&&o.every(s=>s.split(' ').length<=2))return o;return[n||t]}
function parseList(text){const H={DOCUMENTS:'doc',EQUIPMENT:'Equipment',CLOTHING:'Clothing',FOOTWEAR:'Footwear',TOILETRIES:'Toiletries','PERSONAL FIRST AID KIT':'First aid','FIRST AID':'First aid'};let cat=null,buf=[],out=[],seen=new Set();
for(const l of text.replace(/\u00a0/g,' ').split('\n').map(s=>s.trim()).filter(Boolean)){const u=l.toUpperCase();if(u=='SUSTAINABLE PACKING')break;if(H[u]){cat=H[u];buf=[];continue}
if(!cat||/^(item|importance|checklist|item importance checklist)$/i.test(l)||/^\d+$/.test(l)||l[0]=='*')continue;
const m=l.match(/\s*\b(essential|recommended|optional|if applicable|if advised)\s*$/i);
if(m){const t=buf.concat(l.slice(0,m.index)).join(' ').replace(/\*/g,'').replace(/\s+/g,' ').trim();buf=[];if(!t||seen.has(t.toLowerCase()))continue;seen.add(t.toLowerCase());
out.push({id:uid(),t,cat:cat=='doc'?'Other':cat,tier:/if /i.test(m[1])?'cond':m[1].toLowerCase(),doc:cat=='doc',rem:/diamox|antimalarial|prescribed/i.test(t),alts:alts(t)})}else buf.push(l)}
const x=text.match(/limited to\s*(\d+(?:\.\d+)?)\s*kg/i);return{reqs:out,maxKg:x?+x[1]:null}}
function tmpl(act,days,season){const cold=season=='winter'||season=='autumn',L=[],a=(t,cat,tier,al)=>L.push({id:uid(),t,cat,tier,alts:al||[t]});
a('Waterproof jacket','Clothing','essential');a('Waterproof overtrousers','Clothing',act=='hillwalking'&&!cold?'recommended':'essential');a('Base layer','Clothing','essential');a('Fleece','Clothing','essential');
a('Insulated jacket','Clothing',cold?'essential':'recommended',['Down jacket','Synthetic jacket','Puffa jacket']);a('Walking trousers','Clothing','essential');
if(cold){a('Warm hat','Clothing','essential');a('Gloves','Clothing','essential')}
a('Walking boots','Footwear','essential',['Walking boots','Hiking boots','Mountaineering boots']);a('Walking socks','Footwear','essential');
a('Rucksack','Equipment','essential',['Rucksack','Day pack','Backpack']);a('Head torch','Equipment',days>1||season=='winter'?'essential':'recommended');a('Water bottle','Equipment','essential',['Water bottle','Hydration bladder']);
a('Sunglasses','Equipment','essential');a('Map and compass','Equipment','essential');a('Trekking poles','Equipment','recommended');a('First aid kit','First aid','essential');a('Sunscreen','Toiletries','essential');
if(days>1){a('Sleeping bag','Sleeping','essential');a('Dry bags','Equipment','recommended');a('Duffle bag','Equipment',act=='trekking'?'essential':'recommended',['Duffle bag','Hold-all'])}
if(act=='mountaineering'||(season=='winter'&&act!='hillwalking')){a('Crampons','Technical','essential');a('Ice axe','Technical','essential');a('Helmet','Technical','essential')}
return L}
const T=id=>S.trips.find(t=>t.id==id);
const ev=t=>t.reqs.filter(r=>!r.doc&&!r.rem).map(r=>{const g=S.gear.find(x=>hit(x,r));const st=g||(t.cov||[]).includes(r.id)?'ok':(t.plan||[]).includes(r.id)?'plan':'miss';return{r,st,g}});
const dayRe=/waterproof jacket|shell|bottle|torch|sunglasses|snack|camera|pole|sunscreen|sun hat|cap|glove|buff/;
function pack(t){t.as=t.as||{};ev(t).forEach(o=>{if(o.g&&!t.as[o.g.id])t.as[o.g.id]=t.days<=1?'p':/boot/i.test(o.g.name)?'w':dayRe.test(o.g.name.toLowerCase())?'p':'d'})}
const inBag=(t,c)=>S.gear.filter(g=>t.as&&t.as[g.id]==c);const wt=(t,c)=>inBag(t,c).reduce((s,g)=>s+kg(g.g),0);
let bag='d',cur=null,mode='act';
const BN={d:'Duffle',p:'Day pack',w:'Worn'};
function go(h){location.hash=h}
function view(){const h=location.hash.slice(2).split('/'),p=h[0]||'wall';let html='';
if(S.terms!=TERMS)return terms();
$('#tabs').innerHTML=`<a href="#/wall" class="${p=='wall'||p=='item'?'on':''}">Gear wall</a><a href="#/gear" class="${p=='gear'||p=='add'||p=='import'?'on':''}">Gear Store</a><a href="#/trips" class="${p=='trips'||p=='trip'||p=='new'?'on':''}">Trips</a>`;
if(p=='wall')html=wallV();else if(p=='item')html=itemV(h[1]);else if(p=='gear')html=gearV();else if(p=='add')html=addV(decodeURIComponent(h[1]||''));else if(p=='import')html=impV();else if(p=='trips')html=tripsV();else if(p=='new')html=newV();else if(p=='trip'){cur=h[1];html=tripV()}
$('#app').innerHTML=html;window.scrollTo(0,0)}
function terms(){$('#tabs').innerHTML='';$('#app').innerHTML=`<h1 style="justify-content:center;margin-top:24px">Before you start</h1><div class="c">${[['Suggestions, not instructions','Kit lists, gaps and weights are suggestions to help you plan. They can be incomplete or wrong.'],['Not a safety tool','Don\'t rely on this app for your safety. It doesn\'t replace training, experience or the advice of a guide.'],['Check the real requirements','Always confirm against the organiser\'s own list, the forecast, local conditions and official advice.'],['The decisions are yours','You are responsible for what you pack and do. We take no liability for loss, injury or damage arising from using the app.']].map(x=>`<div class="r"><div><b>${x[0]}</b><div class="s" style="font-size:14px">${x[1]}</div></div></div>`).join('')}</div>
<label class="r c" style="margin-top:12px;gap:12px"><input type="checkbox" id="ag" style="width:22px;margin:0" onchange="$('#go').disabled=!this.checked"><span>I've read and understand this, and I accept the full terms.</span></label>
<p class="s">We save the date and version you accepted on this device.</p><button class="p big" id="go" disabled data-a="accept">Continue</button>`}
const P={jk:'M9 3L3 6l2 5 3-1v11h8V10l3 1 2-5-6-3c-1 2-5 2-6 0zM12 5v16',tr:'M7 3h10l1 18h-4l-2-10-2 10H6z',gl:'M8 21v-6L6 11V8l2 1V4a1 1 0 012 0v4V3a1 1 0 012 0v5V4a1 1 0 012 0v5l2-1v3l-2 4v6z',ht:'M5 15a7 7 0 0114 0zM3 15h18v3H3z',bl:'M8 3L3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c-1 2-5 2-6 0z',mc:'M12 7a2 2 0 10-2-2M12 7v3l9 6H3z',bt:'M7 3h6v8l6 3v5H4v-3l3-2z',sk:'M8 3h7v9l4 4a3 3 0 01-3 4H9a4 4 0 01-4-4c0-3 3-3 3-6z',ax:'M12 3v17M5 8c3-4 11-4 14 0M12 21l-1.5-3h3z',fa:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',fire:'M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 3-6 1 2 2 2 2-4z',tent:'M2 20L12 4l10 16zM12 4v16',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10'};
const SL=[{id:'jk',g:'c',l:'Jackets',p:[P.jk],f:/jacket|shell|puffa|fleece|gilet/},{id:'tr',g:'c',l:'Trousers',p:[P.tr],f:/trouser|pants|shorts|tights/},{id:'gl',g:'c',l:'Gloves',p:[P.gl],f:/glove|mitt/},{id:'ht',g:'c',l:'Hats',p:[P.ht],f:/\bhat\b|\bcap\b|buff|balaclava|beanie/},{id:'bl',g:'c',l:'Base layers',p:[P.bl],f:/base layer|thermal|shirt|\btop\b/},{id:'mc',g:'c',l:'More clothing',p:[P.mc],f:(g)=>g.cat=='Clothing'},
{id:'sk',g:'f',l:'Socks, gaiters',p:[P.sk],f:/sock|gaiter/},{id:'bt',g:'f',l:'Boots, shoes',p:[P.bt],f:(g)=>g.cat=='Footwear'},
{id:'ax',g:'k',l:'Equipment',p:[P.ax],f:(g)=>['Equipment','Technical'].includes(g.cat)},{id:'fa',g:'k',tub:1,l:'First aid',p:[P.fa],f:(g)=>g.cat=='First aid'},{id:'cp',g:'k',tub:1,l:'Camp and cooking',p:[P.fire,P.tent],f:(g)=>['Cooking and camp','Sleeping'].includes(g.cat)},{id:'ot',g:'k',tub:1,l:'Everything else',p:[P.box],f:()=>true}];
const slotOf=g=>{const n=g.name.toLowerCase();return SL.find(s=>typeof s.f=='function'?s.f(g,n):s.f.test(n))};
const sv=(p,sm)=>`<svg viewBox="0 0 24 24" ${sm?'style="width:34px;height:34px"':''}><path d="${p}"/></svg>`;
let ws=null;
function wallV(){const by={};SL.forEach(s=>by[s.id]=[]);S.gear.forEach(g=>by[slotOf(g).id].push(g));
const t0=S.trips[0],miss=t0?ev(t0).filter(o=>o.st=='miss'&&o.r.tier=='essential'):[],tw=S.gear.reduce((a,g)=>a+kg(g.g),0);
const cell=s=>{const n=by[s.id].length,gap=!n&&!s.tub&&!['ax','mc'].includes(s.id)&&miss.some(o=>{const x=o.r.alts.join(' ').toLowerCase();return typeof s.f=='function'?0:s.f.test(x)}),st=n?'own':gap?'gap':'empty';
return `<div class="slot ${st} ${s.tub?'tub':''} ${ws==s.id?'sel':''}" data-a="slot" data-id="${s.id}"><i class="hook"></i>${s.p.map(p=>sv(p,s.p.length>1)).join('')}<b>${s.l}</b><span class="s">${n?n+(n==1?' item':' items'):gap?'Gap':'Empty'}</span></div>`};
const sec=(g,t,c)=>`<h3>${t}</h3><div class="wall"><div class="wg ${c||''}">${SL.filter(s=>s.g==g).map(cell).join('')}</div></div>`;
const open=SL.find(s=>s.id==ws),oi=open?by[open.id]:[];
return `<h1>Gear wall<button class="p" data-a="go" data-h="/add">Add gear</button></h1><div class="s" style="margin:-6px 0 4px">${S.gear.length} ${S.gear.length==1?'item':'items'} · ${fmt(tw)}</div>`+
(miss.length?`<div class="warn" style="margin-top:10px">${miss.length} essential ${miss.length==1?'gap':'gaps'} for <a href="#/trip/${t0.id}" style="color:inherit">${esc(t0.name)}</a>. Filled amber icons show where.</div>`:'')+
sec('c','Clothing')+sec('f','Footwear')+sec('k','Kit','k')+
(open?`<h3>${open.l}</h3><div class="c">${oi.length?oi.map(g=>`<div class="r" data-a="go" data-h="/item/${g.id}"><div>${esc(g.name)}<div class="s">${g.cat}</div></div><span class="s">${g.g?fmt(kg(g.g)):'no weight'}</span></div>`).join(''):'<div class="r s">Nothing here yet</div>'}</div><button class="big" data-a="go" data-h="/add">Add gear</button>`:'<p class="s" style="text-align:center">Tap a hook or tub to see what\'s in it.</p>')+FT}
function itemV(id){const g=S.gear.find(x=>x.id==id);if(!g)return wallV();return `<h1>Edit gear</h1><div class="c" style="padding:12px"><label class="s">Name</label><input id="n" value="${esc(g.name)}"><label class="s">Type</label><select id="c">${CATS.map(c=>`<option ${c==g.cat?'selected':''}>${c}</option>`).join('')}</select><label class="s">Weight in grams</label><input id="g" type="number" inputmode="numeric" value="${g.g||''}"></div><button class="p big" data-a="upg" data-id="${id}">Save</button><button class="big" data-a="delg2" data-id="${id}">Delete</button><button class="big" data-a="back">Cancel</button>`}
function gearV(){const by=c=>S.gear.filter(g=>g.cat==c);
return `<h1>Gear Store<span><button data-a="go" data-h="/import">Import</button><button class="p" data-a="go" data-h="/add">Add gear</button></span></h1>`+
(S.gear.length?CATS.filter(c=>by(c).length).map(c=>`<h3>${c}</h3><div class="c">${by(c).map(g=>`<div class="r"><div>${esc(g.name)}${g.g?'':'<div class="s">No weight yet</div>'}</div><span class="s">${g.g?fmt(kg(g.g)):''}</span><button class="l" data-a="delg" data-id="${g.id}">Delete</button></div>`).join('')}</div>`).join(''):
`<div class="empty"><b>Your Gear Store is empty</b><p>Bring in the gear you already own, or add it one item at a time.</p><button class="p" data-a="go" data-h="/import">Import a list</button> <button data-a="go" data-h="/add">Add one item</button></div>`)+
`<h3>Backup</h3><div class="c" style="padding:12px"><p class="s" style="margin-top:0">Your data lives only on this device. Copy a backup now and then.</p><button data-a="bk">Copy backup</button><textarea id="rs" placeholder="Paste a backup here to restore" style="min-height:70px"></textarea><button data-a="rest">Restore</button></div>`+FT}
function addV(n){return `<h1>Add gear</h1><div class="c" style="padding:12px"><label class="s">Name (brand and model)</label><input id="n" value="${esc(n)}"><label class="s">Type</label><select id="c">${CATS.map(c=>`<option ${c==guess(n)?'selected':''}>${c}</option>`).join('')}</select><label class="s">Weight in grams (optional)</label><input id="g" type="number" inputmode="numeric"></div><button class="p big" data-a="addg">Save</button><button class="big" data-a="back">Cancel</button>`}
function impV(){return `<h1>Import gear</h1><p class="s">One item per line. Add a weight in grams after a comma, for example: Down jacket, 600</p><textarea id="t" placeholder="Waterproof jacket, 450&#10;Head torch, 90&#10;Merino base layer"></textarea><button class="p big" data-a="imp">Add to Gear Store</button><button class="big" data-a="back">Cancel</button>`+FT}
function tripsV(){return `<h1>Trips<button class="p" data-a="go" data-h="/new">New trip</button></h1>`+(S.trips.length?`<div class="c">${S.trips.map(t=>{const e=ev(t).filter(o=>o.r.tier=='essential'),m=e.filter(o=>o.st=='miss').length;pack(t);return `<a class="r" href="#/trip/${t.id}" style="text-decoration:none;color:inherit"><div><b>${esc(t.name)}</b><div class="s">${t.days} ${t.days==1?'day':'days'}</div><div class="${m?'w':'o'}" style="font-size:14px">${m?m+' essential '+(m==1?'item':'items')+' missing':'No gaps'}</div></div><span class="s">${t.maxKg?fmt(wt(t,'d'))+' / '+t.maxKg:''}</span></a>`}).join('')}</div>`:`<div class="empty"><b>No trips yet</b><p>Paste an event kit list or build one from an activity.</p><button class="p" data-a="go" data-h="/new">New trip</button></div>`)+FT}
function newV(){const A=mode=='act';return `<h1>New trip</h1><div class="seg"><button class="${A?'on':''}" data-a="mode" data-m="act">From activity</button><button class="${A?'':'on'}" data-a="mode" data-m="list">Paste kit list</button></div><div class="c" style="padding:12px"><label class="s">Name</label><input id="n" placeholder="Trip name">`+
(A?`<label class="s">Activity</label><select id="a"><option>hillwalking</option><option selected>trekking</option><option>scrambling</option><option>mountaineering</option></select><label class="s">Season</label><select id="s"><option>spring</option><option>summer</option><option selected>autumn</option><option>winter</option></select>`:`<label class="s">Kit list text (copy it from the organiser's PDF)</label><textarea id="x"></textarea>`)+
`<label class="s">Days</label><input id="d" type="number" value="${A?3:6}" min="1" max="30"></div><button class="p big" data-a="mk">Create trip</button><button class="big" data-a="back">Cancel</button>`+FT}
function tripV(){const t=T(cur);if(!t)return tripsV();pack(t);save();const r=ev(t),miss=r.filter(o=>o.st=='miss'&&o.r.tier=='essential'),w=wt(t,bag),lim=bag=='d'?t.maxKg:null;
