<style>

@media(prefers-color-scheme:dark){:root{--bg:#0f1620;--cd:#162130;--tx:#eaf0f6;--mu:#9aa8ba;--ln:#263548;--circ:#1f3044;--ac:#f0954a;--acb:#3a2a1c;--ok:#4cc78b;--wn:#f2b24c;--wnb:#3a2f14;--bad:#ff7a73;--pri:#eaf0f6;--on:#0f1620}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top)}

.c{background:var(--cd);border:1px solid var(--ln);border-radius:12px;overflow:hidden}.r{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--ln);min-height:48px}.r:first-child{border-top:0}.r>div{flex:1;min-width:0}
.s{font-size:12px;color:var(--mu)}.w{color:var(--wn)}.b{color:var(--bad)}.o{color:var(--ok)}
button,select,input,textarea{font:inherit;color:var(--tx)}button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);cursor:pointer;box-shadow:0 1px 2px rgba(20,38,66,.06)}

.pills{display:flex;gap:6px;flex:none}.pill{min-height:38px;padding:0 11px;font-size:13px;font-weight:600;border-radius:10px}.pill.pd.on{background:linear-gradient(180deg,#31548a,#1f3a63);color:#fff;border-color:transparent}.pill.pp.on{background:linear-gradient(180deg,#ea8a3c,#c9631a);color:#fff;border-color:transparent}
.bags{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bags .bagc{padding:10px}.bags .bagc>div:nth-child(2){font-size:20px!important}.pill.pw.on{background:linear-gradient(180deg,#43977f,#2b6e5b);color:#fff;border-color:transparent}.ar{flex-wrap:wrap}.ar>div:first-child{flex:1 1 100%}.ar .pills{width:100%}.ar .pill{flex:1}.bagc{padding:12px}
h1 button,.empty button{min-height:36px;padding:0 13px;font-size:14px;border-radius:10px}h1 button.p svg,.empty button.p svg{width:12px;height:12px;margin-right:5px!important}

input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);margin:4px 0}textarea{min-height:120px}
.bar{height:7px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pri)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1}.seg .on{background:var(--acb);border-color:var(--ac);color:var(--ac);font-weight:600}

.warn{background:var(--wnb);color:var(--wn);padding:9px 12px;border-radius:10px;font-size:14px;margin-bottom:8px}.ft{font-size:12px;color:var(--mu);text-align:center;margin:18px 6px}
.ck{width:26px;height:26px;border:2px solid var(--mu);border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;padding:28px 10px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px;margin-top:6px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:30px 22px}}

.bk.has .s{color:var(--ac)}

.sheet{background:#fff;color:#000;border:1px solid var(--ln);padding:22px;border-radius:6px;max-width:210mm;margin:12px auto}.sheet h2{margin:0;font-size:26px;letter-spacing:.04em}.sheet h4{margin:18px 0 6px;font-size:13px;letter-spacing:.12em;border-bottom:1.5px solid #000;padding-bottom:3px}
.kr{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:15px}.bx{width:15px;height:15px;border:1.6px solid #000;flex:none;display:grid;place-items:center;font-size:12px;line-height:1;font-weight:700}.tot{margin-top:18px;border-top:1.5px solid #000;padding-top:8px;font-size:14px;font-weight:600}.kr em{margin-left:auto;font-style:normal;font-size:11px;letter-spacing:.08em;border:1px solid #000;padding:1px 6px}.kr em.m{background:#000;color:#fff}.kr em.w{border-style:dashed}
.pg{display:none}
@media print{body{background:#fff;padding:0}.tabs,.noprint{display:none!important}#app{max-width:none;padding:0}.sheet{border:0;padding:0;margin:0;max-width:none}.cat{break-inside:avoid}@page{size:A4;margin:16mm}.pg{display:block;text-align:center;font-size:11px;margin-top:14px}}
</style></head><body><div id="app"></div><nav class="tabs" id="tabs"></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TERMS='2026-10-v1';
const CATS=['Shells','Down','Fleece','Base Layers','Legwear','Hats & Gloves','Footwear','Bags','Equipment','Tents','Sleeping','Cooking','Hydration','Navigation & Lighting','Safety','Other'];
const slug=c=>c.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),bySlug=s=>CATS.find(c=>slug(c)==s);
const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'').replace(/s$/,'');
const CMAP=Object.fromEntries(CATS.map(c=>[norm(c),c]));Object.assign(CMAP,{hat:'Hats & Gloves',glove:'Hats & Gloves',hatsandglove:'Hats & Gloves',firstaid:'Safety',navigation:'Navigation & Lighting',lighting:'Navigation & Lighting',light:'Navigation & Lighting',navigationlighting:'Navigation & Lighting',navigationandlighting:'Navigation & Lighting'});
const OLDCAT={'Hats':'Hats & Gloves','Gloves':'Hats & Gloves','First Aid':'Safety','Navigation':'Navigation & Lighting'};
function guess(t){t=String(t).toLowerCase();const h=r=>r.test(t);
return h(/trouser|pants|shorts|tights|legging|salopette|\bbibs?\b/)?'Legwear':h(/sleeping|bivi|liner|quilt/)?'Sleeping':h(/\bdown\b|puffa|puffer|insulated/)?'Down':h(/shell|waterproof|gore-?tex|rain/)?'Shells':h(/fleece/)?'Fleece':h(/base ?layer|thermal|merino/)?'Base Layers':h(/glove|mitt|\bhat\b|beanie|\bcap\b|buff|balaclava/)?'Hats & Gloves':h(/boot|shoe|sock|gaiter|trainer/)?'Footwear':h(/tent|tarp|bivvy/)?'Tents':h(/stove|\bpot\b|cook|\bmug\b/)?'Cooking':h(/bottle|bladder|hydration|flask/)?'Hydration':h(/first aid|plaster|blister|whistle|emergency|survival/)?'Safety':h(/gps|compass|\bmap\b|navigation|head ?torch|headlamp|lantern|\btorch\b|lighting/)?'Navigation & Lighting':h(/ice axe|crampon|harness|helmet|rope|\baxe\b/)?'Equipment':h(/rucksack|backpack|duffle|hold-?all|\bpack\b|\bbag\b/)?'Bags':'Other'}

/* ---------- storage layer (swap this for a cloud store later) ---------- */
const Store={K:'gearstore.v2',OLD:'gearstore.v1',
load(){let d=null;try{d=JSON.parse(localStorage.getItem(this.K))}catch(e){}if(d&&d.v==2){let ch=0;(d.inventory||[]).forEach(i=>{if(OLDCAT[i.category]){i.category=OLDCAT[i.category];ch=1}});if(ch)this.save(d);return d}
try{const o=JSON.parse(localStorage.getItem(this.OLD));if(o)return this.migrate(o)}catch(e){}
return{v:2,inventory:[],trips:[],settings:{terms:'',termsDate:''}}},
migrate(o){const t=now();const d={v:2,inventory:(o.gear||[]).map(g=>({id:g.id,model:g.name,brand:'',category:guess(g.name),g:g.g||null,created_at:t,updated_at:t})),trips:(o.trips||[]),settings:{terms:o.terms||'',termsDate:o.termsDate||''}};localStorage.setItem(this.K,JSON.stringify(d));return d},
save(d){localStorage.setItem(this.K,JSON.stringify(d))}};
let S=Store.load();const save=()=>Store.save(S);
const nm=i=>((i.brand?i.brand+' ':'')+i.model).trim();

/* ---------- icons: illustrated images in /icons ---------- */
const svg=c=>`<img src="icons/${slug(c)}.webp" alt="" decoding="async">`;

/* ---------- trips: assign gear to duffle / day pack ---------- */
const kg=g=>(g||0)/1000,fmt=n=>n.toFixed(1)+' kg';
const FT='<p class="ft">Suggestions only. Always check the organiser\'s own list and don\'t rely on this app for your safety. Your data is stored only in this browser on this device; it is not backed up or synced.</p>';
const T=id=>S.trips.find(t=>t.id==id);
const ENVS=['Alpine','Mountain','Moorland','Lowland','Coastal','Forest','Tundra','Arctic / Polar','Desert','Tropical','Other'];
const BN={d:'Duffle',p:'Day pack',w:'Worn'};
const asg=t=>{t.as=t.as||{};t.pk=t.pk||[];for(const k in t.as)if(t.as[k]!='d'&&t.as[k]!='p'&&t.as[k]!='w')delete t.as[k];return t.as};
const inBag=(t,c)=>S.inventory.filter(g=>asg(t)[g.id]==c);const qn=g=>Math.max(1,parseInt(g.qty)||1),cnt=l=>l.reduce((s,g)=>s+qn(g),0),iw=g=>kg(g.g)*qn(g);const wt=(t,c)=>inBag(t,c).reduce((s,g)=>s+iw(g),0);
let bag='d',cur=null,tm='assign',IMP=null;
const fd=(a,b)=>{if(!a)return'';const f=(d,y)=>new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:y?'numeric':undefined}),A=new Date(a+'T12:00'),B=b&&new Date(b+'T12:00');
if(!b||b==a)return f(a,1);if(A.getMonth()==B.getMonth()&&A.getFullYear()==B.getFullYear())return A.getDate()+'–'+f(b,1);return f(a)+' – '+f(b,1)};

/* ---------- views ---------- */
const go=h=>location.hash=h;
function view(){const h=location.hash.slice(2).split('/'),p=h[0]||'wall';
if(S.settings.terms!=TERMS)return terms();
const tab=x=>['wall','cat','item','add'].includes(p)?x=='g':['trips','trip','new','edit','kit'].includes(p)?x=='t':x=='s';
$('#tabs').innerHTML=`<a href="#/wall" class="${tab('g')?'on':''}">Gear</a><a href="#/trips" class="${tab('t')?'on':''}">Trips</a><a href="#/settings" class="${tab('s')?'on':''}">Settings</a>`;
$('#app').className=p=='wall'?'wide':'';
let html='';
if(p=='wall')html=wallV();else if(p=='cat')html=catV(h[1]);else if(p=='item')html=itemV(h[1]);else if(p=='add')html=itemV(null,h[1]);else if(p=='settings')html=setV();else if(p=='import'){IMP=null;html=impV()}
else if(p=='trips')html=tripsV();else if(p=='new')html=newV();else if(p=='edit')html=newV(T(h[1]));else if(p=='trip'){cur=h[1];html=tripV()}else if(p=='kit'){cur=h[1];html=kitV()}else html=wallV();
$('#app').innerHTML=html;window.scrollTo(0,0)}
function terms(){$('#tabs').innerHTML='';$('#app').innerHTML=`<h1 style="justify-content:center;margin-top:24px">Before you start</h1><div class="c">${[['Suggestions, not instructions','Kit lists, gaps and weights are suggestions to help you plan. They can be incomplete or wrong.'],['Not a safety tool','Don\'t rely on this app for your safety. It doesn\'t replace training, experience or the advice of a guide.'],['Check the real requirements','Always confirm against the organiser\'s own list, the forecast, local conditions and official advice.'],['The decisions are yours','You are responsible for what you pack and do. We take no liability for loss, injury or damage arising from using the app.']].map(x=>`<div class="r"><div><b>${x[0]}</b><div class="s" style="font-size:14px">${x[1]}</div></div></div>`).join('')}</div>
<label class="r c" style="margin-top:12px;gap:12px"><input type="checkbox" style="width:22px;margin:0" onchange="$('#go').disabled=!this.checked"><span>I've read and understand this, and I accept the full terms.</span></label>
<p class="s">We save the date and version you accepted on this device.</p><button class="p big" id="go" disabled data-a="accept">Continue</button>`}
function wallV(){const n=c=>cnt(S.inventory.filter(i=>i.category==c));
return `<h1>Gear Wall<button class="p" data-a="go" data-h="/add">${PLUS}Add gear</button></h1><div class="s">${cnt(S.inventory)} ${cnt(S.inventory)==1?'item':'items'} owned</div>
<div class="grid">${CATS.map(c=>`<a class="bk ${n(c)?'has':''}" href="#/cat/${slug(c)}"><div class="circ">${svg(c)}</div><b>${c}</b><span class="s">${n(c)?n(c)+(n(c)==1?' item':' items'):'Empty'}</span></a>`).join('')}</div>`+
(S.inventory.length?'':`<div class="empty"><b>Your Gear Wall is empty</b><p>Import a CSV of what you own, or add items one at a time.</p><button class="p" data-a="go" data-h="/import">Import CSV</button> <button data-a="go" data-h="/add">Add one item</button></div>`)+FT}
function catV(s){const c=bySlug(s);if(!c)return wallV();const l=S.inventory.filter(i=>i.category==c).sort((a,b)=>nm(a).localeCompare(nm(b)));
return `<a class="back" href="#/wall">‹ Gear Wall</a><h1><span style="gap:12px"><span style="width:48px;height:48px;border-radius:50%;overflow:hidden">${svg(c)}</span>${c}</span><button class="p" data-a="go" data-h="/add/${s}">${PLUS}Add</button></h1>`+
(l.length?`<div class="c">${l.map(i=>`<div class="r" data-a="go" data-h="/item/${i.id}" style="cursor:pointer"><div><div class="s">${esc(i.brand)||'No brand'}</div><b style="font-weight:600">${esc(i.model)}</b>${qn(i)>1?` <span class="s">×${qn(i)}</span>`:''}<div class="s">${i.category}</div></div><span class="s">${i.g?fmt(kg(i.g))+(qn(i)>1?' each':''):''}</span><span class="s">›</span></div>`).join('')}</div>`:`<div class="empty"><b>Nothing in ${c} yet</b><p>Add an item or import a CSV.</p></div>`)+FT}
function itemV(id,cs){const i=id?S.inventory.find(x=>x.id==id):null;if(id&&!i)return wallV();const cat=i?i.category:(bySlug(cs)||'Other');
return `<a class="back" href="#/${i?'cat/'+slug(i.category):cs?'cat/'+cs:'wall'}">‹ Back</a><h1>${i?'Edit gear':'Add gear'}</h1><div class="c" style="padding:12px"><label class="s">Brand</label><input id="b" value="${esc(i?.brand)}"><label class="s">Model</label><input id="m" value="${esc(i?.model)}"><label class="s">Category</label><select id="c">${CATS.map(c=>`<option ${c==cat?'selected':''}>${c}</option>`).join('')}</select><label class="s">Quantity owned</label><input id="q" type="number" inputmode="numeric" min="1" value="${i?qn(i):1}"><label class="s">Weight of one, in grams (optional)</label><input id="g" type="number" inputmode="numeric" value="${i?.g||''}"></div>
<button class="p big" data-a="saveg" data-id="${id||''}">Save</button>${i?`<button class="big" data-a="dup" data-id="${id}">Duplicate this item</button><button class="big" data-a="delg" data-id="${id}">Delete</button>`:''}<button class="big" data-a="back">Cancel</button>`}
function setV(){return `<h1>Settings</h1><div class="c"><div class="r" data-a="go" data-h="/import" style="cursor:pointer"><div><b style="font-weight:600">Import CSV</b><div class="s">Columns: Model, Brand, Category (optional Quantity, Weight)</div></div><span class="s">›</span></div></div>
<h3>Gear data</h3><div class="c" style="padding:12px"><p class="s" style="margin-top:0">Remove every item from your Gear Wall so you can import a fresh CSV. Your trips are kept. Tip: copy a backup first.</p><button class="b" data-a="wipe">Delete all gear (${S.inventory.length} ${S.inventory.length==1?'item':'items'})</button></div><h3>Export / Backup</h3><div class="c" style="padding:12px"><p class="s" style="margin-top:0">Your data lives only in this browser on this device. It isn't synced or backed up. Copy a backup now and then.</p><div class="pills" style="flex-wrap:wrap"><button class="p" data-a="dl">Download backup file</button><button data-a="bk">Copy backup</button></div><h3 style="margin-top:16px">Restore</h3><label class="s">From a backup file</label><input type="file" id="rf" accept=".json,application/json,text/plain"><label class="s">Or paste a copied backup</label><textarea id="rs" placeholder="Paste a backup here to restore" style="min-height:70px"></textarea><button data-a="rest">Restore from pasted text</button></div>`+FT}
function impV(){if(IMP)return impR();return `<a class="back" href="#/settings">‹ Settings</a><h1>Import CSV</h1><p class="s">The first row must be exactly: <b>Model,Brand,Category</b>. Optional columns: <b>Quantity</b> and <b>Weight</b> (grams, or e.g. 0.45kg). A blank weight is imported as 0 g. Category must be one of the 16 Gear Wall categories.</p><div class="c" style="padding:12px"><input type="file" id="f" accept=".csv,text/csv"></div><p class="s">Nothing is imported until you confirm the preview.</p>`+FT}
function csv(t){t=t.replace(/^\uFEFF/,'');const R=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';R.push(r);r=[]}else f+=c}
if(f!=''||r.length){r.push(f);R.push(r)}return R.filter(r=>r.some(x=>x.trim()))}
function startImp(text){const R=csv(text),H=(R[0]||[]).map(x=>x.trim().toLowerCase()),ix=['model','brand','category'].map(k=>H.indexOf(k)),qi=H.indexOf('quantity')>=0?H.indexOf('quantity'):H.indexOf('qty'),wi=H.findIndex(x=>/^weight/.test(x));
if(ix.includes(-1)){IMP={bad:'Header row must contain exactly Model, Brand and Category. Found: '+esc((R[0]||[]).join(', ')||'nothing')};return}
IMP={rows:R.slice(1).map((r,n)=>{const model=(r[ix[0]]||'').trim(),brand=(r[ix[1]]||'').trim(),raw=(r[ix[2]]||'').trim(),err=[];if(!model)err.push('Model is missing');if(!brand)err.push('Brand is missing');if(!raw)err.push('Category is missing');
let w=0;const wr=wi>=0?(r[wi]||'').trim():'';if(wr){const mm=wr.replace(/,/g,'').match(/^(\d+(?:\.\d+)?)\s*(kg|g)?$/i);if(!mm)err.push('Weight isn\'t a number');else w=Math.round(parseFloat(mm[1])*(/kg/i.test(mm[2]||'')?1000:1))}
return{n:n+2,model,brand,raw,err,w,qty:qi>=0?Math.max(1,parseInt(r[qi])||1):1,cat:CMAP[norm(raw)]||null}})}}
function impR(){if(IMP.bad)return `<a class="back" href="#/import">‹ Back</a><h1>Import CSV</h1><div class="warn">${IMP.bad}</div><button class="big" data-a="go" data-h="/import">Choose another file</button>`;
const R=IMP.rows,inv=R.filter(r=>r.err.length),fix=R.filter(r=>!r.err.length&&!r.cat),ok=R.filter(r=>!r.err.length&&r.cat&&r.cat!='-'),sk=R.filter(r=>r.cat=='-');
return `<a class="back" href="#/import">‹ Back</a><h1>Preview</h1><div class="c" style="padding:12px"><b class="o">${ok.length} valid</b> · <b class="${inv.length?'b':''}">${inv.length} invalid</b> · <b class="${fix.length?'w':''}">${fix.length} need a category</b>${sk.length?` · ${sk.length} skipped`:''}</div>
${fix.length?'<div class="warn" style="margin-top:8px">Some categories aren\'t recognised. Pick one for each, or skip the row.</div>':''}
<div class="c" style="margin-top:8px">${R.map((r,i)=>`<div class="r"><div><b style="font-weight:600">${esc(r.brand)} ${esc(r.model)}</b><div class="s">Row ${r.n}${r.w?' · '+r.w+' g':''}${r.err.length?` · <span class="b">${r.err.join(', ')}</span>`:r.cat?` → <b>${r.cat=='-'?'Skipped':r.cat}</b>`:''}</div>${!r.err.length&&!r.cat?`<select data-ch="${i}"><option value="">Choose category… ("${esc(r.raw)}")</option>${CATS.map(c=>`<option>${c}</option>`).join('')}<option value="-">Skip this row</option></select>`:''}</div></div>`).join('')}</div>
<label class="r c" style="margin-top:10px;gap:12px"><input type="checkbox" id="rp" style="width:22px;margin:0" ${IMP.replace?'checked':''}><span>Replace my current gear (${S.inventory.length} ${S.inventory.length==1?'item':'items'}) with this import</span></label><button class="p big" data-a="doimp" ${fix.length||!ok.length?'disabled':''}>Import ${ok.length} ${ok.length==1?'item':'items'}</button>${inv.length?'<p class="s">Invalid rows will be left out.</p>':''}<button class="big" data-a="go" data-h="/settings">Cancel</button>`}
const PLUS='<svg viewBox="0 0 16 16" width="14" height="14" style="margin-right:7px;vertical-align:-1px"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const byName=(a,b)=>nm(a).localeCompare(nm(b));
const tmeta=t=>[t.dest,t.env,fd(t.start,t.end)].filter(Boolean).map(esc).join(' · ');
function tripsV(){return `<h1>Trips<button class="p" data-a="go" data-h="/new">${PLUS}New trip</button></h1>`+(S.trips.length?`<div class="c">${S.trips.map(t=>{asg(t);const nd=cnt(inBag(t,'d')),np=cnt(inBag(t,'p')),nw=cnt(inBag(t,'w'));return `<a class="r" href="#/trip/${t.id}" style="text-decoration:none;color:inherit"><div><b>${esc(t.name)}</b><div class="s">${tmeta(t)||'No details yet'}</div><div class="s">Duffle ${nd} · ${fmt(wt(t,'d'))} &nbsp; Day pack ${np} · ${fmt(wt(t,'p'))} &nbsp; Worn ${nw} · ${fmt(wt(t,'w'))}</div></div><span class="s">›</span></a>`}).join('')}</div>`:`<div class="empty"><b>No trips yet</b><p>Create a trip, then assign your gear to the duffle or day pack.</p><button class="p" data-a="go" data-h="/new">${PLUS}New trip</button></div>`)+FT}
function newV(t){t=t||{};return `<a class="back" href="#/${t.id?'trip/'+t.id:'trips'}">‹ Back</a><h1>${t.id?'Edit trip':'New trip'}</h1><div class="c" style="padding:12px"><label class="s">Trip name</label><input id="n" placeholder="e.g. Kilimanjaro" value="${esc(t.name)}"><label class="s">Destination (optional)</label><input id="dst" value="${esc(t.dest)}"><label class="s">Environment</label><select id="env"><option value="">Not set</option>${ENVS.map(e=>`<option ${e==t.env?'selected':''}>${e}</option>`).join('')}</select><label class="s">Start date (optional)</label><input id="sd" type="date" value="${esc(t.start)}"><label class="s">End date (optional)</label><input id="ed" type="date" value="${esc(t.end)}"><label class="s">Duffle weight limit in kg (optional)</label><input id="mk" type="number" inputmode="decimal" value="${t.maxKg||''}"></div><button class="p big" data-a="mk" data-id="${t.id||''}">${t.id?'Save trip':'Create trip'}</button><button class="big" data-a="back">Cancel</button>`+FT}
function tripV(){const t=T(cur);if(!t)return tripsV();asg(t);save();
const card=c=>{const l=inBag(t,c),w=wt(t,c),lim=c=='d'?t.maxKg:null;return `<div class="c bagc"><div class="s">${BN[c]}</div><div style="font-size:24px;font-weight:700">${fmt(w)}</div><div class="s">${cnt(l)} ${cnt(l)==1?'item':'items'}${lim?' · limit '+lim+' kg':''}</div>${lim?`<div class="bar"><i style="width:${Math.min(100,w/lim*100)}%;${w>lim?'background:var(--bad)':''}"></i></div>${w>lim?`<div class="s b">Over by ${fmt(w-lim)}</div>`:''}`:''}${l.some(g=>!g.g)?'<div class="s">Some items have no weight</div>':''}</div>`};
const tick=g=>`<div class="r" data-a="tk" data-id="${g.id}" style="cursor:pointer"><span class="ck ${t.pk.includes(g.id)?'on':''}">${t.pk.includes(g.id)?'✓':''}</span><div>${esc(nm(g))}<div class="s">${g.category}${qn(g)>1?' · ×'+qn(g):''}${g.g?' · '+fmt(iw(g)):''}</div></div></div>`;
let body;
if(!S.inventory.length)body=`<div class="empty"><b>No gear yet</b><p>Add gear to your Gear Wall first, then assign it here.</p><button class="p" data-a="go" data-h="/import">Import CSV</button> <button data-a="go" data-h="/add">Add one item</button></div>`;
else if(tm=='assign')body=CATS.filter(c=>S.inventory.some(i=>i.category==c)).map(c=>`<h3>${c}</h3><div class="c">${S.inventory.filter(i=>i.category==c).sort(byName).map(g=>`<div class="r ar"><div><div>${esc(nm(g))}</div>${qn(g)>1||g.g?`<div class="s">${qn(g)>1?'×'+qn(g)+(g.g?' · ':''):''}${g.g?fmt(iw(g)):''}</div>`:''}</div><div class="pills"><button class="pill pd ${t.as[g.id]=='d'?'on':''}" data-a="as" data-id="${g.id}" data-b="d">Duffle</button><button class="pill pp ${t.as[g.id]=='p'?'on':''}" data-a="as" data-id="${g.id}" data-b="p">Day pack</button><button class="pill pw ${t.as[g.id]=='w'?'on':''}" data-a="as" data-id="${g.id}" data-b="w">Worn</button></div></div>`).join('')}</div>`).join('');
else body=['d','p','w'].map(c=>{const l=inBag(t,c).sort(byName);return `<h3>${BN[c]} · ${l.filter(g=>t.pk.includes(g.id)).length} of ${l.length} packed</h3><div class="c">${l.length?l.map(tick).join(''):'<div class="r s">Nothing assigned yet</div>'}</div>`}).join('');
return `<a class="back" href="#/trips">‹ Trips</a><h1 style="font-size:22px">${esc(t.name)}<button data-a="go" data-h="/edit/${t.id}">Edit</button></h1><div class="s" style="margin:-8px 0 10px">${tmeta(t)}</div>
<button class="p big" style="margin:0 0 12px" data-a="go" data-h="/kit/${t.id}">Export Kit List</button>
<div class="bags">${card('d')}${card('p')}${card('w')}</div>
<div class="seg" style="margin-top:14px"><button class="${tm=='assign'?'on':''}" data-a="tmode" data-m="assign">Assign gear</button><button class="${tm=='pack'?'on':''}" data-a="tmode" data-m="pack">Packing list</button></div>`+body+`<button class="big" data-a="delt" data-id="${t.id}">Delete trip</button>`+FT}

/* ---------- kit list ---------- */
function kitData(t){asg(t);const out={};CATS.forEach(c=>out[c]=[]);
S.inventory.filter(g=>t.as[g.id]).sort(byName).forEach(g=>out[g.category].push({t:nm(g)+(qn(g)>1?' ×'+qn(g):''),b:t.as[g.id],pk:t.pk.includes(g.id)}));
return CATS.filter(c=>out[c].length).map(c=>[c,out[c]])}
function kitV(){const t=T(cur);if(!t)return tripsV();const D=kitData(t),meta=[t.dest,t.env,fd(t.start,t.end)].filter(Boolean);
return `<div class="noprint"><a class="back" href="#/trip/${t.id}">‹ ${esc(t.name)}</a><div class="seg"><button class="p" data-a="print">Print / Save PDF</button><button data-a="img">Save image</button></div><p class="s">Tip: in the print dialog choose “Save as PDF” for a PDF file.</p></div>
<div class="sheet" id="sheet"><h2>${esc(t.name.toUpperCase())}</h2>${meta.map(m=>`<div>${esc(m)}</div>`).join('')}<h4 style="font-size:15px;margin-top:22px">KIT LIST</h4>
${D.length?D.map(([c,l])=>`<div class="cat"><h4>${c.toUpperCase()}</h4>${l.map(i=>`<div class="kr"><span class="bx">${i.pk?'✓':''}</span><span>${esc(i.t)}</span><em class="${i.b=='p'?'m':i.b=='w'?'w':''}">${BN[i.b].toUpperCase()}</em></div>`).join('')}</div>`).join(''):'<p>No gear assigned yet.</p>'}
<div class="tot">Duffle ${fmt(wt(t,'d'))} &nbsp;·&nbsp; Day pack ${fmt(wt(t,'p'))} &nbsp;·&nbsp; Worn ${fmt(wt(t,'w'))}</div><div class="pg">Kit list · ${esc(t.name)}</div></div>`}
function kitImg(){const t=T(cur),D=kitData(t),W=1240,P=80,L=[];
L.push(['t',t.name.toUpperCase()]);[t.dest,t.env,fd(t.start,t.end)].filter(Boolean).forEach(m=>L.push(['m',m]));L.push(['g',0]);L.push(['k','KIT LIST']);
D.forEach(([c,l])=>{L.push(['h',c.toUpperCase()]);l.forEach(i=>L.push(['i',i.t,BN[i.b].toUpperCase(),i.pk,i.b]))});
L.push(['f','Duffle '+fmt(wt(t,'d'))+'   ·   Day pack '+fmt(wt(t,'p'))+'   ·   Worn '+fmt(wt(t,'w'))]);
const H=P*2+L.reduce((a,x)=>a+({t:64,m:40,g:20,k:60,h:64,i:44,f:70}[x[0]]),0),cv=document.createElement('canvas');cv.width=W;cv.height=Math.max(H,1754);const x=cv.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,W,cv.height);x.fillStyle='#000';x.strokeStyle='#000';x.textBaseline='top';let y=P;const F='-apple-system,Helvetica,Arial,sans-serif';
L.forEach(l=>{if(l[0]=='t'){x.font='bold 54px '+F;x.fillText(l[1],P,y);y+=64}else if(l[0]=='m'){x.font='30px '+F;x.fillText(l[1],P,y);y+=40}else if(l[0]=='g')y+=20;else if(l[0]=='k'){x.font='bold 32px '+F;x.fillText(l[1],P,y+14);y+=60}
else if(l[0]=='h'){y+=18;x.font='bold 24px '+F;x.fillText(l[1],P,y);x.fillRect(P,y+32,W-P*2,2);y+=46}
else if(l[0]=='f'){y+=24;x.font='bold 26px '+F;x.fillText(l[1],P,y);y+=46}
else{x.lineWidth=3;x.strokeRect(P,y+6,24,24);if(l[3]){x.font='bold 22px '+F;x.fillText('✓',P+3,y+8)}x.font='28px '+F;x.fillText(l[1],P+44,y+4);x.font='bold 18px '+F;const w=x.measureText(l[2]).width;
if(l[4]=='p'){x.fillRect(W-P-w-16,y+5,w+16,28);x.fillStyle='#fff';x.fillText(l[2],W-P-w-8,y+10);x.fillStyle='#000'}else{if(l[4]=='w')x.setLineDash([6,4]);x.strokeRect(W-P-w-16,y+5,w+16,28);x.setLineDash([]);x.fillText(l[2],W-P-w-8,y+10)}y+=44}});
cv.toBlob(b=>{const f=new File([b],'kit-list.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kit-list.png';a.click()}})}

/* ---------- actions ---------- */
const A={
accept(){S.settings.terms=TERMS;S.settings.termsDate=now();save();location.hash='/wall';view()},go(d){go(d.h)},back(){history.back()},tmode(d){tm=d.m;const y=scrollY;view();scrollTo(0,y)},print(){window.print()},img(){kitImg()},
saveg(d){const m=$('#m').value.trim();if(!m){alert('Model is required');return}const v={brand:$('#b').value.trim(),model:m,category:$('#c').value,g:+$('#g').value||null,qty:Math.max(1,parseInt($('#q').value)||1),updated_at:now()};
if(d.id){Object.assign(S.inventory.find(x=>x.id==d.id),v)}else S.inventory.push({id:uid(),created_at:now(),...v});save();go('/cat/'+slug(v.category))},
wipe(){if(!S.inventory.length){alert('Your Gear Wall is already empty');return}if(confirm('Delete all '+S.inventory.length+' gear items? This can\'t be undone unless you have a backup. Trips are kept.')){S.inventory=[];save();alert('All gear deleted. You can now import a new CSV.');view()}},
dup(d){const i=S.inventory.find(x=>x.id==d.id);if(!i)return;const c={...i,id:uid(),created_at:now(),updated_at:now()};S.inventory.push(c);save();go('/item/'+c.id)},
delg(d){if(confirm('Delete this item?')){const i=S.inventory.find(g=>g.id==d.id);S.inventory=S.inventory.filter(g=>g.id!=d.id);save();go('/cat/'+slug(i.category))}},
doimp(){if(IMP.replace&&!confirm('This deletes your '+S.inventory.length+' current items and replaces them with the import. Continue?'))return;const t=now();if(IMP.replace)S.inventory=[];IMP.rows.filter(r=>!r.err.length&&r.cat&&r.cat!='-').forEach(r=>S.inventory.push({id:uid(),model:r.model,brand:r.brand,category:r.cat,g:r.w||0,qty:r.qty||1,created_at:t,updated_at:t}));save();IMP=null;go('/wall');view()},
mk(d){const n=$('#n').value.trim();if(!n){alert('Give the trip a name');return}const t=d.id?T(d.id):{id:uid(),as:{},pk:[],created_at:now()};Object.assign(t,{name:n,dest:$('#dst').value.trim(),env:$('#env').value,start:$('#sd').value,end:$('#ed').value,maxKg:+$('#mk').value||null,updated_at:now()});if(!d.id)S.trips.unshift(t);save();go('/trip/'+t.id)},
as(d){const t=T(cur),m=asg(t);if(m[d.id]==d.b){delete m[d.id];t.pk=t.pk.filter(x=>x!=d.id)}else m[d.id]=d.b;save();const y=scrollY;view();scrollTo(0,y)},
tk(d){const t=T(cur),i=t.pk.indexOf(d.id);i<0?t.pk.push(d.id):t.pk.splice(i,1);save();const y=scrollY;view();scrollTo(0,y)},
delt(d){if(confirm('Delete this trip?')){S.trips=S.trips.filter(t=>t.id!=d.id);save();go('/trips')}},
bk(){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Backup copied')).catch(()=>{$('#rs').value=j;$('#rs').select();alert('Copy the text in the box')})},
rest(){doRestore($('#rs').value)},
dl(){const j=JSON.stringify(S,null,1),fn='gear-bag-backup-'+new Date().toISOString().slice(0,10)+'.json',b=new Blob([j],{type:'application/json'}),f=new File([b],fn,{type:'application/json'});
if(/iPhone|iPad/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove()}}};
function doRestore(txt){try{let o=JSON.parse(txt);if(o.gear&&!o.inventory)o=Store.migrate(o);if(!o.inventory||!o.trips)throw 0;if(confirm('Replace everything on this device with the backup?')){S=o;S.v=2;S.settings=S.settings||{terms:'',termsDate:''};S.inventory.forEach(i=>{if(OLDCAT[i.category])i.category=OLDCAT[i.category]});save();view()}}catch(e){alert('That doesn\'t look like a backup')}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='rf'&&t.files[0]){t.files[0].text().then(doRestore)}
else if(t.id=='f'&&t.files[0]){t.files[0].text().then(x=>{startImp(x);$('#app').innerHTML=impR()})}
else if(t.id=='rp'){IMP.replace=t.checked}
else if(t.dataset.ch!==undefined){IMP.rows[+t.dataset.ch].cat=t.value||null;const y=scrollY;$('#app').innerHTML=impR();scrollTo(0,y)}});
addEventListener('hashchange',view);view();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
